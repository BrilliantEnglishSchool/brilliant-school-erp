{% extends 'layout.html' %}{% block content %}<h2>Staff Documents</h2><form method="post" class="card form-grid"><select name="staff_id" required><option value="">Select staff</option>{% for s in staff %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select>
<input name="document_type" placeholder="Document Type" required><input name="document_number" placeholder="Document Number"><input type="date" name="issue_date"><input type="date" name="expiry_date"><input name="remarks" placeholder="Remarks"><button>Add Document</button></form>
<div class="card"><table><tr><th>Staff</th><th>Document</th><th>Number</th><th>Issue</th><th>Expiry</th><th>Remarks</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.document_type}}</td><td>{{r.document_number}}</td><td>{{r.issue_date}}</td><td>{{r.expiry_date}}</td><td>{{r.remarks}}</td></tr>{% endfor %}</table></div>{% endblock %}
