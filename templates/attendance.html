{% extends "layout.html" %}{% block content %}<h1>Attendance</h1><div class="card"><p class="muted">Active session: {{active.year}}</p><form method="post" action="/attendance/save"><input class="input" type="date" name="date"><br><br><table class="table"><tr><th>Roll</th><th>Name</th><th>Class</th><th>Status</th></tr>{% for x in students %}<tr><td>{{x.roll_no}}</td><td>{{x.name}}</td><td>{{x.class_name}}</td><td><select class="input" name="student_{{x.id}}"><option>Present</option><option>Absent</option><option>Leave</option></select></td></tr>{% endfor %}</table><br><button class="btn">Save Attendance</button></form></div>{% endblock %}
