{% extends 'layout.html' %}{% block content %}
<h2>Grade Settings</h2><form method="post"><div class="card"><table><tr><th>Grade</th><th>Minimum %</th><th>Maximum %</th></tr>
{% for g in grades %}<tr><td><input name="grade" value="{{g.grade}}"></td><td><input type="number" step="0.01" name="min_percent" value="{{g.min_percent}}"></td><td><input type="number" step="0.01" name="max_percent" value="{{g.max_percent}}"></td></tr>{% endfor %}
</table><button>Save Grade Scale</button></div></form>{% endblock %}
