{% extends "layout.html" %}{% block content %}<h1>Academic Sessions</h1><div class="card"><form method="post"><div style="display:flex;gap:10px"><input class="input" type="number" name="year" placeholder="2029" required><button class="btn">+ Create Session</button></div></form></div><div class="card"><table class="table"><tr><th>Session</th><th>Status</th><th>Action</th></tr>{% for s in sessions %}<tr><td>{{s.year}}</td><td>{{s.status}}</td><td>{% if s.status!='Active' %}<form method="post" action="/sessions/{{s.year}}/activate"><button class="btn">Set Active</button></form>{% else %}Current session{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
