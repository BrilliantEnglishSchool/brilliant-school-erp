{% extends "layout.html" %}{% block content %}<h1>Fees</h1><div class="card"><p class="muted">Active session: {{active.year}}</p><table class="table"><tr><th>Receipt</th><th>Student</th><th>Amount</th><th>Date</th></tr>{% for x in fees %}<tr><td>{{x.receipt_no}}</td><td>{{x.name}}</td><td>₹{{x.amount}}</td><td>{{x.paid_date}}</td></tr>{% else %}<tr><td colspan="4">No fee payments recorded yet.</td></tr>{% endfor %}</table></div>{% endblock %}
