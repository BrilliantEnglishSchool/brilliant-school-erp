{% extends "layout.html" %}{% block content %}<h1>Examinations</h1><div class="card"><p class="muted">Active session: {{active.year}}</p><table class="table"><tr><th>Exam</th><th>Class</th><th>Subject</th><th>Max Marks</th></tr>{% for x in exams %}<tr><td>{{x.name}}</td><td>{{x.class_name}}</td><td>{{x.subject}}</td><td>{{x.max_marks}}</td></tr>{% else %}<tr><td colspan="4">No exams created yet.</td></tr>{% endfor %}</table></div>{% endblock %}
